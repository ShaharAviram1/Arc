[project]
name = "arc"
version = "0.1.0"
description = "Arc — multi-user self-hosted anime server (API + worker)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "anitopy>=2.1",
    "rapidfuzz>=3.10",
    "httpx>=0.28",
    "anthropic>=1.4.0",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "apscheduler>=3.11",
    "python-multipart>=0.0.20",
    "openai>=3.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arc"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["arc.services.*", "arc.core.*"]
strict = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "anitopy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# ``-m "not live"`` is a spending guard, not a preference: the live eval calls
# the real Anthropic API, and a developer who happens to have ANTHROPIC_API_KEY
# exported must not pay for `make test`. A command-line ``-m`` replaces this
# one, so `uv run pytest -m live` still runs them.
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "pg: needs a running PostgreSQL (make dev-db); set ARC_SKIP_PG_TESTS=1 to skip",
    "slow: exercises real ffmpeg/qBittorrent instead of a mock",
    "live: calls the real recommendation provider (RECS_PROVIDER); costs quota. Excluded from `make test` by addopts; run with `uv run pytest -m live`, and it skips when the selected provider has no key",
]
